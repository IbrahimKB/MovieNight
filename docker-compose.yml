version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecurePassword123}
      POSTGRES_DB: boksh_apps
    volumes:
      - /srv/storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - movienight_net
    ports:
      - "5432:5432"

  movienight:
    build:
      context: .
    image: movienight:prod
    container_name: movienight
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    depends_on:
      postgres:
        condition: service_healthy

    # Healthcheck must confirm Next.js server is responding
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    environment:
      NODE_ENV: production
      # INTERNAL DB connection for inside the container
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-SuperSecurePassword123}@postgres:5432/boksh_apps"
      TMDB_API_KEY: ${TMDB_API_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@movie-night.co.uk}

    # DNS for stable API calls (optional but good)
    dns:
      - 8.8.8.8
      - 1.1.1.1

    # Expose only internally; nginx proxy handles public traffic
    ports:
      - "127.0.0.1:3001:3000"

    networks:
      - movienight_net

  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    depends_on:
      movienight:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - movienight_net

networks:
  movienight_net:
    driver: bridge
